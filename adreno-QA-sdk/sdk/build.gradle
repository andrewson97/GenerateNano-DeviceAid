apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.iterate.adreno.sdk'
    compileSdk 34
    
    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-O3 -DNDEBUG -fvisibility=hidden -fstack-protector-all -fPIE -D_FORTIFY_SOURCE=2"
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libomp.so'
        
        // CRITICAL: Exclude bundled OpenCL - use system OpenCL driver instead!
        exclude 'lib/arm64-v8a/libOpenCL.so'
        
        // Exclude assets (model and menu provided by app)
        exclude 'assets/**'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
    implementation 'org.json:json:20230227'
    
    // ONNX Runtime for RAG embeddings
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}

// Task to export AAR as GMK_V1.0.aar
task exportAar(type: Copy) {
    dependsOn 'assembleRelease'
    from('build/outputs/aar/')
    include('sdk-release.aar')
    into(project.projectDir.parentFile.path + '/output/')
    rename('sdk-release.aar', 'Adreno_QA_SDK_V1.0.aar')
    doLast {
        println ""
        println "✅✅✅ ADRENO Q&A SDK V1.0 CREATED SUCCESSFULLY! ✅✅✅"
        println "========================================================"
        println "📦 SDK Name: Adreno_QA_SDK_V1.0.aar"
        println "📍 Location: adreno-menu-sdk/output/"
        println "📏 Model: NOT included (app provides)"
        println "💬 System Prompt: Customizable (app provides)"
        println "🎮 GPU: arm64-v8a native libraries included"
        println "⚡ KV Cache: 5-10x faster responses"
        println "🚀 Features:"
        println "   - GPU-accelerated inference"
        println "   - Streaming responses"
        println "   - Configurable GPU layers"
        println "   - Custom system prompts"
        println "   - Conversation history"
        println "   - RAG context support"
        println ""
        println "📱 Ready for Q&A applications!"
        println "========================================================"
    }
}

// Create output directory
task createOutputDir {
    doLast {
        new File(project.projectDir.parentFile, 'output').mkdirs()
    }
}

exportAar.dependsOn createOutputDir

